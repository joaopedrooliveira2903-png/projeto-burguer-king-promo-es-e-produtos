<!DOCTYPE html>
<html
    class="light"
    lang="pt-BR"
>

<head>

    <meta charset="utf-8">

    <meta
        content="width=device-width, initial-scale=1.0"
        name="viewport"
    >

    <title>
        Gerenciamento de Promoções - Admin
    </title>


    <!-- Google Fonts -->

    <link
        href="https://fonts.googleapis.com"
        rel="preconnect"
    >

    <link
        crossorigin=""
        href="https://fonts.gstatic.com"
        rel="preconnect"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800&family=Work+Sans:wght@400;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Material Symbols -->

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet"
    >


    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- CSS Customizado -->

    <link rel="stylesheet" href="../css/style.css">


    <!-- Configuração -->

    <script>

        tailwind.config = {

            darkMode: "class",

            theme: {

                extend: {

                    colors: {

                        "on-secondary-container": "#7a4433",
                        "on-primary-fixed": "#3e0400",
                        "on-tertiary-container": "#fff0dc",
                        "surface-container-highest": "#ebe1d2",
                        "error-red": "#B00020",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#5e4200",
                        "on-primary": "#ffffff",
                        "outline": "#926f68",
                        "surface-dim": "#e2d9ca",
                        "on-secondary-fixed": "#360f03",
                        "on-background": "#1f1b12",
                        "on-surface-variant": "#5d403a",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#fcf2e3",
                        "on-primary-container": "#ffeeea",
                        "tertiary-fixed-dim": "#ffbb1b",
                        "on-secondary-fixed-variant": "#6c3928",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffdea7",
                        "on-error-container": "#93000a",
                        "on-surface": "#1f1b12",
                        "surface": "#fff8f1",
                        "primary-container": "#d62300",
                        "secondary-container": "#feb59e",
                        "surface-container-high": "#f1e7d8",
                        "outline-variant": "#e7bdb5",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#ffb4a5",
                        "tertiary": "#715000",
                        "surface-variant": "#ebe1d2",
                        "off-white-bg": "#F5EBDC",
                        "inverse-primary": "#ffb4a5",
                        "on-primary-fixed-variant": "#8e1400",
                        "secondary-fixed-dim": "#feb59e",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "success-green": "#008000",
                        "inverse-on-surface": "#faefe0",
                        "flame-red": "#D62300",
                        "primary-fixed": "#ffdad3",
                        "tertiary-container": "#906700",
                        "secondary": "#88503e",
                        "flame-yellow": "#FFB906",
                        "inverse-surface": "#353026",
                        "secondary-fixed": "#ffdbd0",
                        "background": "#fff8f1",
                        "bk-brown": "#502314",
                        "on-tertiary-fixed": "#271900",
                        "surface-tint": "#b91d00",
                        "surface-bright": "#fff8f1",
                        "surface-container": "#f7edde",
                        "primary": "#a91a00"
                    },

                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },

                    spacing: {
                        "margin-mobile": "20px",
                        "stack-md": "24px",
                        "margin-desktop": "64px",
                        base: "8px",
                        "stack-lg": "48px",
                        gutter: "24px",
                        "touch-target-min": "56px",
                        "stack-sm": "12px"
                    },

                    fontFamily: {
                        "display-lg": ["Epilogue"],
                        "button-text": ["Work Sans"],
                        "body-md": ["Work Sans"],
                        "headline-lg-mobile": ["Epilogue"],
                        "body-lg": ["Work Sans"],
                        "headline-lg": ["Epilogue"],
                        "label-lg": ["Work Sans"]
                    },

                    fontSize: {

                        "display-lg": [
                            "48px",
                            {
                                lineHeight: "56px",
                                letterSpacing: "-0.02em",
                                fontWeight: "800"
                            }
                        ],

                        "button-text": [
                            "20px",
                            {
                                lineHeight: "24px",
                                fontWeight: "700"
                            }
                        ],

                        "body-md": [
                            "18px",
                            {
                                lineHeight: "28px",
                                fontWeight: "400"
                            }
                        ],

                        "headline-lg-mobile": [
                            "28px",
                            {
                                lineHeight: "36px",
                                fontWeight: "700"
                            }
                        ],

                        "body-lg": [
                            "20px",
                            {
                                lineHeight: "30px",
                                fontWeight: "400"
                            }
                        ],

                        "headline-lg": [
                            "32px",
                            {
                                lineHeight: "40px",
                                fontWeight: "700"
                            }
                        ],

                        "label-lg": [
                            "18px",
                            {
                                lineHeight: "24px",
                                letterSpacing: "0.01em",
                                fontWeight: "600"
                            }
                        ]
                    }
                }
            }
        };

    </script>


    <style>

        .material-symbols-outlined {

            font-family: 'Material Symbols Outlined';

            font-weight: normal;

            font-style: normal;

            font-size: 24px;

            line-height: 1;

            letter-spacing: normal;

            text-transform: none;

            display: inline-block;

            white-space: nowrap;

            word-wrap: normal;

            direction: ltr;

            font-feature-settings: 'liga';

            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: max(884px, 100dvh);
        }

    </style>

</head>


<body
    class="bg-off-white-bg text-on-surface font-body-md min-h-screen pb-32"
>


    <!-- ============================== -->
    <!-- HEADER -->
    <!-- ============================== -->

    <header
        class="bg-surface sticky top-0 w-full z-40 border-b-2 border-bk-brown flex justify-between items-center px-margin-mobile py-base"
    >

        <div class="flex items-center gap-4">

            <span
                aria-hidden="true"
                class="material-symbols-outlined text-primary text-3xl"
                style="font-variation-settings: 'FILL' 1;"
            >
                lunch_dining
            </span>

            <h1
                class="font-display-lg text-headline-lg-mobile text-primary tracking-tight"
            >
                BURGER KING
            </h1>

        </div>


        <div class="flex items-center gap-2">
            <a href="painel.html" class="text-bk-brown font-bold hover:text-flame-red transition flex items-center gap-1 px-2" aria-label="Voltar ao painel">
                <span class="material-symbols-outlined">arrow_back</span>
                <span class="hidden sm:inline">Voltar</span>
            </a>
            <a href="../index.html" class="text-bk-brown font-bold hover:text-flame-red transition px-2" aria-label="Menu principal">
                <span class="material-symbols-outlined">home</span>
            </a>
            <div
                class="w-10 h-10 rounded-full bg-surface-container-highest border-2 border-bk-brown flex items-center justify-center overflow-hidden"
            >

                <span class="material-symbols-outlined text-bk-brown">person</span>

            </div>
        </div>

    </header>


    <!-- ============================== -->
    <!-- CONTEÚDO -->
    <!-- ============================== -->

    <main
        class="max-w-4xl mx-auto px-margin-mobile pt-stack-md flex flex-col gap-stack-md"
    >


        <!-- Título -->

        <div
            class="flex flex-col gap-stack-sm md:flex-row md:justify-between md:items-end"
        >

            <div>

                <h2
                    class="font-headline-lg-mobile text-headline-lg-mobile text-bk-brown"
                >
                    Promoções Atuais
                </h2>

                <p
                    class="font-body-md text-body-md text-on-surface-variant mt-2"
                >
                    Gerencie as ofertas disponíveis no aplicativo.
                </p>

            </div>


            <button
                id="btnNovaPromocao"
                type="button"
                class="w-full md:w-auto min-h-touch-target-min bg-flame-red text-on-primary font-button-text text-button-text px-8 rounded-lg border-2 border-transparent hover:border-flame-yellow focus:border-flame-yellow transition-transform active:translate-y-0.5 flex items-center justify-center gap-2"
            >

                <span class="material-symbols-outlined">
                    add_circle
                </span>

                Nova Promoção

            </button>

        </div>


        <!-- ============================== -->
        <!-- LISTA DINÂMICA -->
        <!-- ============================== -->

        <div id="listaPromocoes" class="flex flex-col gap-stack-sm">

            <!--
                O JavaScript vai preencher esta área
                com as promoções do Supabase.
            -->

            <div
                class="bg-surface-container-lowest border-2 border-bk-brown rounded-xl p-6 text-center"
            >

                <span
                    class="material-symbols-outlined text-4xl text-bk-brown"
                >
                    hourglass_empty
                </span>

                <p class="mt-2">
                    Carregando promoções...
                </p>

            </div>

        </div>

    </main>
    <!-- MENU MOBILE -->
    <nav
        class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center bg-surface px-2 pb-4 pt-2 border-t-2 border-bk-brown z-50"
    >
        <!-- Painel -->
        <a
            href="painel.html"
            class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 min-h-touch-target-min min-w-[72px]"
        >
            <span class="material-symbols-outlined text-[28px]">
                dashboard
            </span>
            <span
                class="font-label-lg text-label-lg text-sm mt-1"
            >
                Painel
            </span>
        </a>
        <!-- Produtos -->
        <a
            href="produtos.html"
            class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 min-h-touch-target-min min-w-[72px]"
        >
            <span class="material-symbols-outlined text-[28px]">
                inventory_2
            </span>
            <span
                class="font-label-lg text-label-lg text-sm mt-1"
            >
                Produtos
            </span>
        </a>
        <!-- Promoções -->
        <a
            href="promocoes.html"
            class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-6 py-2 border-2 border-bk-brown min-h-touch-target-min translate-y-0.5 transition-all duration-100"
        >
            <span
                class="material-symbols-outlined text-[28px]"
                style="font-variation-settings: 'FILL' 1;"
            >
                local_offer
            </span>
            <span
                class="font-label-lg text-label-lg text-sm mt-1"
            >
                Promoções
            </span>
        </a>
    </nav>

    <!-- JavaScript -->

    <script type="module" src="../js/promocoes.js"></script>

</body>

</html>
