<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - Burger King</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "bk-brown": "#502314",
                        "flame-red": "#D62300",
                        "off-white-bg": "#F5EBDC",
                        "surface": "#FFF8F1",
                        "surface-container-high": "#F1E7D8",
                        "on-surface": "#1F1B12",
                        "on-surface-variant": "#5D403A"
                    },
                    fontFamily: {
                        display: ["Epilogue", "sans-serif"],
                        body: ["Work Sans", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-off-white-bg text-on-surface font-body flex items-center justify-center px-4">
    <main class="w-full max-w-md bg-surface rounded-2xl border-2 border-bk-brown p-8 shadow-xl">
        <h1 class="text-3xl font-display font-bold text-bk-brown">Criar nova senha</h1>
        <p class="text-on-surface-variant mt-2 mb-6">Digite uma senha nova para sua conta de administrador ou usuário.</p>
        <form id="redefinirForm" class="space-y-5">
            <div>
                <label for="novaSenha" class="block text-sm font-semibold text-bk-brown mb-2">Nova senha</label>
                <input id="novaSenha" type="password" minlength="6" required class="w-full px-4 py-3 rounded-lg border-2 border-surface-container-high focus:outline-none focus:border-flame-red" placeholder="Mínimo de 6 caracteres">
            </div>
            <div>
                <label for="confirmarSenha" class="block text-sm font-semibold text-bk-brown mb-2">Confirmar nova senha</label>
                <input id="confirmarSenha" type="password" minlength="6" required class="w-full px-4 py-3 rounded-lg border-2 border-surface-container-high focus:outline-none focus:border-flame-red" placeholder="Repita a nova senha">
            </div>
            <div id="mensagem" class="rounded-lg p-4 text-sm font-semibold bg-yellow-100 text-yellow-800">Validando o link de recuperação...</div>
            <button type="submit" disabled class="w-full bg-flame-red text-white font-bold py-3 rounded-lg opacity-60 cursor-not-allowed">Salvar nova senha</button>
        </form>
        <a href="login.html" class="block text-center text-flame-red font-bold mt-6">Voltar para o login</a>
    </main>
    <script type="module" src="js/redefinir-senha.js"></script>
</body>
</html>
