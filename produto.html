<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Burger King - Cadastro de Produto</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- CSS Customizado -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;800&family=Work+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Configuração Tailwind -->
    <script>

        tailwind.config = {

            darkMode: "class",

            theme: {

                extend: {

                    colors: {

                        "on-secondary-container": "#7a4433",
                        "on-primary-fixed": "#3e0400",
                        "on-tertiary-container": "#fff0dc",
                        "surface-container-highest": "#ebe1d2",
                        "error-red": "#B00020",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#5e4200",
                        "on-primary": "#ffffff",
                        "outline": "#926f68",
                        "surface-dim": "#e2d9ca",
                        "on-secondary-fixed": "#360f03",
                        "on-background": "#1f1b12",
                        "on-surface-variant": "#5d403a",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#fcf2e3",
                        "on-primary-container": "#ffeeea",
                        "tertiary-fixed-dim": "#ffbb1b",
                        "on-secondary-fixed-variant": "#6c3928",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffdea7",
                        "on-error-container": "#93000a",
                        "on-surface": "#1f1b12",
                        "surface": "#fff8f1",
                        "primary-container": "#d62300",
                        "secondary-container": "#feb59e",
                        "surface-container-high": "#f1e7d8",
                        "outline-variant": "#e7bdb5",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#ffb4a5",
                        "tertiary": "#715000",
                        "surface-variant": "#ebe1d2",
                        "off-white-bg": "#F5EBDC",
                        "inverse-primary": "#ffb4a5",
                        "on-primary-fixed-variant": "#8e1400",
                        "secondary-fixed-dim": "#feb59e",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "success-green": "#008000",
                        "inverse-on-surface": "#faefe0",
                        "flame-red": "#D62300",
                        "primary-fixed": "#ffdad3",
                        "tertiary-container": "#906700",
                        "secondary": "#88503e",
                        "flame-yellow": "#FFB906",
                        "inverse-surface": "#353026",
                        "background": "#fff8f1",
                        "bk-brown": "#502314",
                        "on-tertiary-fixed": "#271900",
                        "surface-tint": "#b91d00",
                        "surface-bright": "#fff8f1",
                        "surface-container": "#f7edde",
                        "primary": "#a91a00"
                    },

                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },

                    spacing: {
                        "margin-mobile": "20px",
                        "stack-md": "24px",
                        "margin-desktop": "64px",
                        base: "8px",
                        "stack-lg": "48px",
                        gutter: "24px",
                        "touch-target-min": "56px",
                        "stack-sm": "12px"
                    },

                    fontFamily: {
                        "display-lg": ["Epilogue"],
                        "button-text": ["Work Sans"],
                        "body-md": ["Work Sans"],
                        "headline-lg-mobile": ["Epilogue"],
                        "body-lg": ["Work Sans"],
                        "headline-lg": ["Epilogue"],
                        "label-lg": ["Work Sans"]
                    }
                }
            }
        };

    </script>


    <style>
        .material-symbols-outlined {

            font-family: 'Material Symbols Outlined';

            font-weight: normal;

            font-style: normal;

            font-size: 24px;

            line-height: 1;

            letter-spacing: normal;

            text-transform: none;

            display: inline-block;

            white-space: nowrap;

            word-wrap: normal;

            direction: ltr;

            font-feature-settings: 'liga';

            -webkit-font-smoothing: antialiased;
        }

        body {

            min-height: max(884px, 100dvh);

        }
    </style>

</head>


<body class="bg-off-white-bg text-on-surface min-h-screen flex flex-col font-body-lg">


    <!-- ============================== -->
    <!-- HEADER -->
    <!-- ============================== -->

    <header
        class="bg-surface dark:bg-inverse-surface w-full top-0 border-b-2 border-bk-brown flex justify-between items-center px-margin-mobile py-base md:px-margin-desktop sticky z-50">

        <div class="flex items-center gap-4">

            <button id="btnVoltar" type="button" aria-label="Voltar para produtos"
                class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high rounded-full p-2 flex items-center justify-center transition-colors min-w-[56px] min-h-[56px]">

                <span class="material-symbols-outlined text-3xl">
                    arrow_back
                </span>

            </button>

            <a href="../index.html" aria-label="Menu principal"
                class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high rounded-full p-2 flex items-center justify-center transition-colors min-w-[56px] min-h-[56px]">
                <span class="material-symbols-outlined text-3xl">home</span>
            </a>

            <a href="../index.html" class="hidden sm:flex items-center gap-1 text-bk-brown font-bold hover:text-flame-red transition" aria-label="Voltar ao menu principal">
                Menu principal
            </a>


            <h1
                class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary dark:text-flame-red tracking-tight font-extrabold uppercase">
                BURGER KING
            </h1>

        </div>


        <div class="flex items-center">

            <div aria-label="Admin Profile"
                class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center border-2 border-bk-brown text-bk-brown font-label-lg text-label-lg">
                AD
            </div>

        </div>

    </header>


    <!-- ============================== -->
    <!-- MAIN -->
    <!-- ============================== -->

    <main class="flex-grow flex flex-col items-center justify-start py-8 px-4 sm:px-6 lg:px-8 w-full max-w-4xl mx-auto">

        <div class="w-full bg-surface rounded-xl border-2 border-bk-brown p-6 md:p-8 shadow-sm">

            <!-- Título -->

            <div class="mb-8 border-b-2 border-surface-container-high pb-4">

                <h2
                    class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-bk-brown mb-2 font-bold">
                    Cadastrar Novo Produto
                </h2>

                <p class="font-body-md text-body-md text-on-surface-variant">
                    Preencha as informações abaixo para adicionar um item ao cardápio.
                </p>

            </div>


            <!-- ============================== -->
            <!-- FORMULÁRIO -->
            <!-- ============================== -->

            <form id="produtoForm" class="space-y-6">

                <!-- Nome do Produto -->
                <div>
                    <label for="nome" class="block text-sm font-bold text-bk-brown mb-2">
                        Nome do Produto *
                    </label>
                    <input 
                        type="text" 
                        id="nome" 
                        name="nome" 
                        placeholder="Ex: Whopper com Queijo"
                        required
                        class="w-full px-4 py-3 border-2 border-surface-container-high rounded-lg focus:outline-none focus:border-flame-red focus:ring-2 focus:ring-flame-red/20 transition"
                    >
                </div>

                <!-- Descrição -->
                <div>
                    <label for="descricao" class="block text-sm font-bold text-bk-brown mb-2">
                        Descrição
                    </label>
                    <textarea 
                        id="descricao" 
                        name="descricao"
                        placeholder="Descreva os ingredientes e características do produto..."
                        rows="4"
                        class="w-full px-4 py-3 border-2 border-surface-container-high rounded-lg focus:outline-none focus:border-flame-red focus:ring-2 focus:ring-flame-red/20 transition resize-none"
                    ></textarea>
                </div>

                <!-- Preço e Tipo -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Preço -->
                    <div>
                        <label for="preco" class="block text-sm font-bold text-bk-brown mb-2">
                            Preço (R$) *
                        </label>
                        <input 
                            type="number" 
                            id="preco" 
                            name="preco" 
                            step="0.01" 
                            min="0" 
                            placeholder="0.00"
                            required
                            class="w-full px-4 py-3 border-2 border-surface-container-high rounded-lg focus:outline-none focus:border-flame-red focus:ring-2 focus:ring-flame-red/20 transition"
                        >
                    </div>

                    <!-- Tipo -->
                    <div>
                        <label for="tipo" class="block text-sm font-bold text-bk-brown mb-2">
                            Tipo *
                        </label>
                        <select 
                            id="tipo" 
                            name="tipo" 
                            required
                            class="w-full px-4 py-3 border-2 border-surface-container-high rounded-lg focus:outline-none focus:border-flame-red focus:ring-2 focus:ring-flame-red/20 transition bg-white"
                        >
                            <option value="">Selecione o tipo</option>
                            <option value="PRODUTO">Produto</option>
                            <option value="SERVICO">Serviço</option>
                        </select>
                    </div>
                </div>

                <!-- Categoria -->
                <div>
                    <label for="categoria" class="block text-sm font-bold text-bk-brown mb-2">
                        Categoria *
                    </label>
                    <select 
                        id="categoria" 
                        name="categoria"
                        required
                        class="w-full px-4 py-3 border-2 border-surface-container-high rounded-lg focus:outline-none focus:border-flame-red focus:ring-2 focus:ring-flame-red/20 transition bg-white"
                    >
                        <option value="">Carregando categorias...</option>
                    </select>
                </div>

                <!-- Mensagem de Feedback -->
                <div id="mensagem" class="hidden p-4 rounded-lg font-semibold text-sm"></div>

                <!-- Botões -->
                <div class="flex gap-4 pt-6 border-t-2 border-surface-container-high">
                    <button 
                        type="submit"
                        class="flex-1 bg-flame-red text-white font-bold py-3 rounded-lg hover:bg-primary transition flex items-center justify-center gap-2 min-h-touch-target-min"
                    >
                        <span class="material-symbols-outlined">add</span>
                        Cadastrar Produto
                    </button>
                    <button 
                        type="reset"
                        class="px-6 py-3 border-2 border-bk-brown text-bk-brown font-bold rounded-lg hover:border-flame-red hover:text-flame-red transition"
                    >
                        Limpar
                    </button>
                </div>

            </form>

        </div>

    </main>


    <!-- JavaScript -->

    <script type="module" src="../js/produto.js"></script>
    
</body>

</html>
