<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Promoção - Burger King Admin</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- CSS Customizado -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;800&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background-color: #F5EBDC;
            color: #1f1b12;
            min-height: 100vh;
        }
    </style>

    <!-- Configuração Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "bk-brown": "#502314",
                        "flame-red": "#D62300",
                        "flame-yellow": "#FFB906",
                        "off-white-bg": "#F5EBDC",
                        "surface": "#FFF8F1",
                        "surface-container": "#F7EDDE",
                        "surface-container-high": "#F1E7D8",
                        "on-surface": "#1F1B12",
                        "on-surface-variant": "#5D403A",
                        "primary": "#A91A00",
                        "success-green": "#008000",
                        "error-red": "#B00020"
                    },
                    fontFamily: {
                        "display": ["Epilogue", "sans-serif"],
                        "body": ["Work Sans", "sans-serif"]
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-off-white-bg">

    <!-- ================================ -->
    <!-- HEADER -->
    <!-- ================================ -->

    <header class="bg-surface border-b-2 border-bk-brown sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-5 md:px-8 py-4 flex items-center justify-between">
            <!-- Logo -->
            <a href="painel.html" class="flex items-center gap-3">
                <span class="material-symbols-outlined text-flame-red text-3xl" style="font-variation-settings: 'FILL' 1;">
                    lunch_dining
                </span>
                <span class="font-display font-bold text-xl md:text-2xl text-flame-red">
                    BURGER KING
                </span>
            </a>

            <!-- Navegação -->
            <div class="flex items-center gap-2">
                <a href="promocoes.html" class="flex items-center gap-2 px-4 py-2 text-bk-brown font-bold hover:text-flame-red transition">
                <span class="material-symbols-outlined">arrow_back</span>
                Voltar
                </a>
                <a href="../index.html" aria-label="Menu principal" class="flex items-center gap-2 px-3 py-2 text-bk-brown font-bold hover:text-flame-red transition">
                    <span class="material-symbols-outlined">home</span>
                    <span class="hidden sm:inline">Menu principal</span>
                </a>
            </div>
        </div>
    </header>

    <!-- ================================ -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ================================ -->

    <main class="max-w-2xl mx-auto px-5 md:px-8 py-12">
        <div class="bg-surface rounded-xl border-2 border-bk-brown p-8 shadow-lg">
            <!-- Título -->
            <h1 class="font-display text-3xl font-bold text-bk-brown mb-2">
                <span class="material-symbols-outlined align-middle mr-2" style="font-variation-settings: 'FILL' 1;">
                    local_offer
                </span>
                Nova Promoção
            </h1>
            <p class="text-on-surface-variant mb-6">Criar uma nova promoção para seus clientes</p>

            <!-- Mensagem de Feedback -->
            <div id="mensagem" class="hidden mb-6 p-4 rounded-lg font-semibold text-sm"></div>

            <!-- Formulário -->
            <form id="promocaoForm" class="space-y-6">
                <!-- Nome -->
                <div>
                    <label for="nome" class="block text-sm font-bold text-bk-brown mb-2">
                        Nome da Promoção *
                    </label>
                    <input 
                        type="text" 
                        id="nome" 
                        name="nome"
                        placeholder="Ex: Combo Família"
                        required
                        class="w-full px-4 py-3 border-2 border-surface-container rounded-lg focus:outline-none focus:border-flame-red focus:ring-2 focus:ring-flame-red/20 transition"
                    >
                </div>

                <!-- Descrição -->
                <div>
                    <label for="descricao" class="block text-sm font-bold text-bk-brown mb-2">
                        Descrição
                    </label>
                    <textarea 
                        id="descricao" 
                        name="descricao"
                        placeholder="Descreva os detalhes da promoção..."
                        rows="4"
                        class="w-full px-4 py-3 border-2 border-surface-container rounded-lg focus:outline-none focus:border-flame-red focus:ring-2 focus:ring-flame-red/20 transition resize-none"
                    ></textarea>
                </div>

                <!-- Tipo de Desconto -->
                <div>
                    <!-- Desconto em Percentual -->
                    <div>
                        <label for="desconto_percentual" class="block text-sm font-bold text-bk-brown mb-2">
                            Desconto (%) 
                        </label>
                        <input 
                            type="number" 
                            id="desconto_percentual" 
                            name="desconto_percentual"
                            placeholder="Ex: 20"
                            min="0"
                            max="100"
                            step="0.01"
                            class="w-full px-4 py-3 border-2 border-surface-container rounded-lg focus:outline-none focus:border-flame-red focus:ring-2 focus:ring-flame-red/20 transition"
                        >
                        <small class="text-on-surface-variant">Deixe em branco se não usar</small>
                    </div>

                </div>

                <!-- Datas -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Data Início -->
                    <div>
                        <label for="data_inicio" class="block text-sm font-bold text-bk-brown mb-2">
                            Data de Início *
                        </label>
                        <input 
                            type="date" 
                            id="data_inicio" 
                            name="data_inicio"
                            required
                            class="w-full px-4 py-3 border-2 border-surface-container rounded-lg focus:outline-none focus:border-flame-red focus:ring-2 focus:ring-flame-red/20 transition"
                        >
                    </div>

                    <!-- Data Fim -->
                    <div>
                        <label for="data_fim" class="block text-sm font-bold text-bk-brown mb-2">
                            Data de Término *
                        </label>
                        <input 
                            type="date" 
                            id="data_fim" 
                            name="data_fim"
                            required
                            class="w-full px-4 py-3 border-2 border-surface-container rounded-lg focus:outline-none focus:border-flame-red focus:ring-2 focus:ring-flame-red/20 transition"
                        >
                    </div>
                </div>

                <!-- Status -->
                <div>
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input 
                            type="checkbox" 
                            id="ativo" 
                            name="ativo"
                            checked
                            class="w-5 h-5 rounded border-2 border-bk-brown"
                        >
                        <span class="text-sm font-semibold text-bk-brown">
                            Ativar promoção imediatamente
                        </span>
                    </label>
                </div>

                <!-- Botões -->
                <div class="flex gap-4 pt-6 border-t-2 border-surface-container">
                    <button 
                        type="submit"
                        class="flex-1 bg-flame-red text-white font-bold py-3 rounded-lg hover:bg-primary transition flex items-center justify-center gap-2"
                    >
                        <span class="material-symbols-outlined">add</span>
                        Criar Promoção
                    </button>
                    <button 
                        type="reset"
                        class="px-6 py-3 border-2 border-bk-brown text-bk-brown font-bold rounded-lg hover:border-flame-red hover:text-flame-red transition"
                    >
                        Limpar
                    </button>
                </div>
            </form>
        </div>

        <!-- Info Box -->
        <div class="mt-8 bg-blue-50 border-l-4 border-blue-600 p-4 rounded">
            <p class="text-sm text-blue-900">
                <strong>💡 Dica:</strong> Informe o desconto percentual entre 0 e 100 para aplicar a promoção.
            </p>
        </div>
    </main>

    <!-- JavaScript -->
    <script type="module" src="../js/nova-promocao.js"></script>

</body>

</html>
